<!DOCTYPE html>
<html>
<head>
    <title>JWT Token Decoder</title>
</head>
<body>
    <h1>JWT Token Decoder</h1>
    <textarea id="tokenInput" placeholder="Paste JWT token here..." style="width: 100%; height: 200px;"></textarea>
    <button onclick="decodeToken()">Decode Token</button>
    <div id="output" style="margin-top: 20px; padding: 10px; background: #f0f0f0; font-family: monospace; white-space: pre-wrap;"></div>

    <script>
        function decodeToken() {
            const token = document.getElementById('tokenInput').value.trim();
            const output = document.getElementById('output');
            
            if (!token) {
                output.textContent = 'Please enter a JWT token';
                return;
            }
            
            try {
                // JWT has 3 parts separated by dots
                const parts = token.split('.');
                if (parts.length !== 3) {
                    output.textContent = 'Invalid JWT token format';
                    return;
                }
                
                // Decode the payload (middle part)
                const payload = JSON.parse(atob(parts[1]));
                
                // Convert timestamps to readable dates
                if (payload.iat) {
                    payload.issuedAt = new Date(payload.iat * 1000).toISOString();
                }
                if (payload.exp) {
                    payload.expiresAt = new Date(payload.exp * 1000).toISOString();
                    payload.isExpired = Date.now() > (payload.exp * 1000);
                }
                
                output.textContent = JSON.stringify(payload, null, 2);
                
            } catch (error) {
                output.textContent = 'Error decoding token: ' + error.message;
            }
        }
        
        // Auto-fill with the token from the logs

    </script>
</body>
