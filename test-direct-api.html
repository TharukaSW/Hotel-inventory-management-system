<!DOCTYPE html>
<html>
<head>
    <title>Direct API Test</title>
</head>
<body>
    <h1>Direct API Test</h1>
    <button onclick="testDirectFetch()">Test Direct Fetch with Token</button>
    <button onclick="testWithoutToken()">Test Without Token</button>
    <div id="output" style="margin-top: 20px; padding: 10px; background: #f0f0f0; font-family: monospace; white-space: pre-wrap;"></div>

    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            output.textContent += new Date().toISOString() + ': ' + message + '\n';
        }
        
        async function testDirectFetch() {
            const token = 'eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJzYW1wbGVhZG1pbkBob3RlbC5jb20iLCJ1c2VySWQiOjIsImVtYWlsIjoic2FtcGxlYWRtaW5AaG90ZWwuY29tIiwiZmlyc3ROYW1lIjoic2FtcGxlYWRtaW4iLCJsYXN0TmFtZSI6IlVzZXIiLCJyb2xlIjoiQURNSU4iLCJpYXQiOjE3NTYxOTQ3MTEsImV4cCI6MTc1NjI4MTExMX0.qjifUJM63tAZMxMBmnxkE-fvEEhpP3OFl8Cbb_MFk7-g_Tw-n87iJD34G-mluQhs_gTBP06mcrGMkaCNNXXCvA';
            
            log('Testing direct fetch with Authorization header...');
            
            try {
                const response = await fetch('http://localhost:8082/api/categories', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });
                
                log(`Response status: ${response.status}`);
                log(`Response headers: ${JSON.stringify(Object.fromEntries(response.headers))}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`Response data: ${JSON.stringify(data, null, 2)}`);
                } else {
                    const text = await response.text();
                    log(`Error response: ${text}`);
                }
            } catch (error) {
                log(`Fetch error: ${error.message}`);
            }
        }
        
        async function testWithoutToken() {
            log('Testing direct fetch without Authorization header...');
            
            try {
                const response = await fetch('http://localhost:8082/api/categories', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                log(`Response status: ${response.status}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`Response data: ${JSON.stringify(data, null, 2)}`);
                } else {
                    const text = await response.text();
                    log(`Error response: ${text}`);
                }
            } catch (error) {
                log(`Fetch error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
