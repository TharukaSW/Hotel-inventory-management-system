version: '3.9'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hotel_inventory
      MYSQL_USER: hotel
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root_pw
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/hotel_inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: hotel
      DB_PW: change_me
      JWT_SECRET: change_me_change_this
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8082"

volumes:
  db_data:
