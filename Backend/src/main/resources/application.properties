spring.application.name=hotel-inventory
# Database (externalized via .env or host environment)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PW}

# PostgreSQL (Neon) JDBC URL example (DO NOT include channel_binding in URL; driver may not recognize it):
# export DB_URL=jdbc:postgresql://ep-rough-shadow-a8ett90f-pooler.eastus2.azure.neon.tech:5432/neondb?sslmode=require
# export DB_USER=neondb_owner
# export DB_PW=your_password_here
# If channel binding is required, set property: spring.datasource.hikari.data-source-properties.channelBinding=require

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initialize database with test data
# Disable automatic re-loading of schema & sample data on every start to preserve existing data
spring.sql.init.mode=never
# spring.sql.init.data-locations=classpath:db/test-data.sql
# spring.jpa.defer-datasource-initialization=true

# Flyway temporarily disabled (current MySQL version < 5.7 not supported by Flyway 11)
# Re-enable after upgrading MySQL server to at least 5.7 (prefer 8.0) OR downgrade Flyway dependency.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Server configuration
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/

# Logging
logging.level.com.example.hotel_inventory=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BIND_LOG_LEVEL:OFF}

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# CORS configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:3003}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration
jwt.secret=${JWT_SECRET:hotel_inventory_dev_default_change_me}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

