spring.application.name=hotel-inventory
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Initialize database with test data
# Disable automatic re-loading of schema & sample data on every start to preserve existing data
spring.sql.init.mode=never
# spring.sql.init.data-locations=classpath:db/test-data.sql
# spring.jpa.defer-datasource-initialization=true

# Flyway temporarily disabled (current MySQL version < 5.7 not supported by Flyway 11)
# Re-enable after upgrading MySQL server to at least 5.7 (prefer 8.0) OR downgrade Flyway dependency.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Server configuration
server.port=8082
server.servlet.context-path=/

# Logging
logging.level.com.example.hotel_inventory=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# CORS configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:3003
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration
jwt.secret=hotel_inventory_secret_key_that_is_long_enough_for_256_bits_security
jwt.expiration=86400000

